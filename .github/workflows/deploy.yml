name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/operent
            git fetch origin main
            git reset --hard origin/main

            # --- Locate .env and load it into shell ---
            echo "=== Searching for .env ==="
            for f in /root/operent/.env /root/operent/backend/.env /root/.env; do
              if [ -f "$f" ]; then
                echo "Found .env at: $f"
                set -a; . "$f"; set +a
                break
              fi
            done

            # --- Show all DB files on VPS (for diagnostics) ---
            echo "=== DB files found on VPS ==="
            find /root /home -name "*.db" -size +10k 2>/dev/null | head -20 || true

            # --- Migrate old DB if it exists and has more data ---
            mkdir -p /root/operent/backend/data
            TARGET_DB="/root/operent/backend/data/rentyourclaw.db"
            TARGET_SZ=$(wc -c < "$TARGET_DB" 2>/dev/null || echo 0)
            for OLD_DB in /root/operent/data/rentyourclaw.db /root/rentyourclaw.db /root/data/rentyourclaw.db; do
              if [ -f "$OLD_DB" ]; then
                OLD_SZ=$(wc -c < "$OLD_DB")
                if [ "$OLD_SZ" -gt "$TARGET_SZ" ]; then
                  echo "Migrating DB from $OLD_DB ($OLD_SZ bytes) — current is $TARGET_SZ bytes"
                  cp -f "$OLD_DB" "$TARGET_DB"
                  TARGET_SZ="$OLD_SZ"
                fi
              fi
            done
            echo "DB size after check: $(wc -c < $TARGET_DB 2>/dev/null || echo 0) bytes"

            cd backend
            npm install --production
            npm rebuild 2>/dev/null || true

            fuser -k 3000/tcp 2>/dev/null || true
            sleep 1
            pm2 delete operent-backend 2>/dev/null || true
            pm2 start server.js --name operent-backend --cwd /root/operent/backend
            pm2 save

            # --- Ensure VPS is registered as agent server ---
            sleep 4
            DEBUG_RESP=$(curl -sf http://localhost:3000/api/debug 2>/dev/null || echo '{}')
            echo "Debug: $DEBUG_RESP"
            if echo "$DEBUG_RESP" | grep -q '"servers":0'; then
              echo "No servers in DB — registering this VPS as agent server"
              ADMIN_KEY_HEADER=""
              if [ -n "${ADMIN_KEY:-}" ]; then
                ADMIN_KEY_HEADER="-H x-admin-key:${ADMIN_KEY}"
              fi
              curl -s -X POST http://localhost:3000/admin/server \
                -H "Content-Type: application/json" \
                ${ADMIN_KEY_HEADER} \
                -d "{\"label\":\"main\",\"ip\":\"${{ secrets.VPS_HOST }}\",\"port\":22,\"user\":\"${{ secrets.VPS_USER }}\",\"password\":\"${{ secrets.VPS_PASSWORD }}\",\"maxAgents\":30}"
              echo ""
              echo "Server registered. New debug:"
              curl -sf http://localhost:3000/api/debug 2>/dev/null || echo "failed"
            fi

            echo "=== PM2 STATUS ==="
            pm2 list
            echo "=== LAST 20 LOG LINES ==="
            pm2 logs operent-backend --lines 20 --nostream || true
