name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/operent
            git fetch origin main
            git reset --hard origin/main
            cd backend
            npm install --production
            npm rebuild 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 1
            pm2 delete operent-backend 2>/dev/null || true
            pm2 start server.js --name operent-backend --cwd /root/operent/backend
            pm2 save
            echo "=== PM2 STATUS ==="
            pm2 list
            echo "=== LAST 20 LOG LINES ==="
            pm2 logs operent-backend --lines 20 --nostream || true
