name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/operent
            git fetch origin main
            git reset --hard origin/main

            # --- Find ALL .env files on server ---
            echo "=== All .env files on server ==="
            find / -name ".env" -not -path "*/node_modules/*" -maxdepth 8 2>/dev/null | head -20 || true

            # --- Locate .env and load it into shell ---
            echo "=== Searching for .env to source ==="
            for f in /root/operent/.env /root/operent/backend/.env /root/.env /etc/environment; do
              if [ -f "$f" ]; then
                echo "Found .env at: $f"
                set -a; . "$f"; set +a
                break
              fi
            done

            # --- Ensure DB directory exists (never touch existing DB) ---
            mkdir -p /root/operent/backend/data

            # --- Write .env with API keys from GitHub secrets ---
            ENV_FILE="/root/operent/backend/.env"
            touch "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            # Write keys only if the secret is non-empty
            update_env() {
              local key="$1" val="$2"
              if [ -n "$val" ]; then
                # Remove existing line for this key, then append
                sed -i "/^${key}=/d" "$ENV_FILE" 2>/dev/null || true
                echo "${key}=${val}" >> "$ENV_FILE"
              fi
            }
            update_env ANTHROPIC_API_KEY "${{ secrets.ANTHROPIC_API_KEY }}"
            update_env OPENAI_API_KEY    "${{ secrets.OPENAI_API_KEY }}"
            update_env GROQ_API_KEY      "${{ secrets.GROQ_API_KEY }}"
            update_env TG_BOT_TOKEN      "${{ secrets.TG_BOT_TOKEN }}"
            echo "=== .env written (keys present: $(grep -c '=.' $ENV_FILE || echo 0)) ==="

            cd backend
            npm install --production
            npm rebuild 2>/dev/null || true

            fuser -k 3000/tcp 2>/dev/null || true
            sleep 1
            pm2 delete operent-backend 2>/dev/null || true
            pm2 start server.js --name operent-backend --cwd /root/operent/backend
            pm2 save

            # --- Ensure VPS is registered as agent server ---
            sleep 4
            DEBUG_RESP=$(curl -sf http://localhost:3000/api/debug 2>/dev/null || echo '{}')
            echo "Debug: $DEBUG_RESP"
            if echo "$DEBUG_RESP" | grep -q '"servers":0'; then
              echo "No servers in DB — registering this VPS as agent server"
              ADMIN_KEY_HEADER=""
              if [ -n "${ADMIN_KEY:-}" ]; then
                ADMIN_KEY_HEADER="-H x-admin-key:${ADMIN_KEY}"
              fi
              curl -s -X POST http://localhost:3000/admin/server \
                -H "Content-Type: application/json" \
                ${ADMIN_KEY_HEADER} \
                -d "{\"label\":\"main\",\"ip\":\"${{ secrets.VPS_HOST }}\",\"port\":22,\"user\":\"${{ secrets.VPS_USER }}\",\"password\":\"${{ secrets.VPS_PASSWORD }}\",\"maxAgents\":30}"
              echo ""
              echo "Server registered. New debug:"
              curl -sf http://localhost:3000/api/debug 2>/dev/null || echo "failed"
            fi

            echo "=== PM2 STATUS ==="
            pm2 list
            echo "=== LAST 20 LOG LINES ==="
            pm2 logs operent-backend --lines 20 --nostream || true
